<script type="module" src="data.js"></script>
<script type="module">
const {players,categories,age}=window.VRAPCE;
const tabs=document.getElementById("tabs"), roster=document.getElementById("roster");

function card(p){
  return `<a class="player ${p.gk?"gk":""}" href="igrac.html?id=${p.id}">${p.name}<small>${p.position} · ${age(p.dob)} god.</small></a>`;
}
function show(id){
  history.replaceState(null,"","#"+id);
  tabs.querySelectorAll("button").forEach(b=>{
    const on=b.dataset.id===id; b.classList.toggle("on",on); b.setAttribute("aria-selected",on);
  });
  const cat=categories.find(c=>c.id===id);
  const list=players.filter(p=>p.category===id);
  if(!list.length){
    roster.innerHTML=`<div class="card empty"><h3>${cat.name}</h3><p>Popis igrača za ovu kategoriju trenutno nije dostupan. Semafor HNS-a prikazuje samo seniorsku momčad kluba.</p></div>`;
    return;
  }
  const gks=list.filter(p=>p.gk), rest=list.filter(p=>!p.gk);
  roster.innerHTML=`
    <h3 class="sub">Vratari</h3><div class="grid players">${gks.map(card).join("")}</div>
    <h3 class="sub">Igrači</h3><div class="grid players">${rest.map(card).join("")}</div>`;
}
tabs.innerHTML=categories.map(c=>`<button role="tab" data-id="${c.id}">${c.name}</button>`).join("");
tabs.addEventListener("click",e=>{const b=e.target.closest("button"); if(b) show(b.dataset.id);});
const start=location.hash.slice(1);
show(categories.some(c=>c.id===start)?start:"seniori");
</script>
