<script type="module" src="data.js"></script>
<script type="module">
const {results,players}=window.VRAPCE;
document.getElementById("results").innerHTML=results.map(r=>`
  <div class="match"><span class="date">${r.date}</span><span class="teams">${r.home} – ${r.away}</span><span class="score ${r.cls}">${r.score}</span></div>`).join("");
document.querySelector("#scorers tbody").innerHTML=players.filter(p=>p.goals>0).sort((a,b)=>b.goals-a.goals||a.name.localeCompare(b.name,"hr"))
  .map(p=>`<tr><td><a href="igrac.html?id=${p.id}">${p.name}</a></td><td>${p.goals}</td></tr>`).join("");
</script>
